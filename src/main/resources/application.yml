spring:
  application:
    name: estoque-madeireira
  datasource:
    url: jdbc:mysql://localhost:3306/estoque_madeireira?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
